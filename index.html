<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>플랜두씨 다이어리</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f6f1e7;
      --sheet: #fffdf8;
      --ink: #2b2620;
      --ink-soft: #6b6257;
      --line: #e3dacb;
      --rule: #d9cfbe;
      --accent: #2f5d50;
      --accent-soft: #e3ece8;
      --high: #b3412e;   --high-bg: #f7e4df;
      --medium: #9a6b14; --medium-bg: #f5ead3;
      --low: #4f6a86;    --low-bg: #e4ebf2;
      --warn-bg: #fff3cf; --warn-line: #e3c56a;
      --error: #a3321f;
      --radius: 10px;
      --serif: "Gowun Batang", serif;
      --sans: "IBM Plex Sans KR", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--paper); color: var(--ink);
      font-family: var(--sans); font-size: 15px; line-height: 1.65;
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 80px; }
    a { color: var(--accent); }
    button, input, select, textarea { font: inherit; color: inherit; }

    /* 머리 */
    header { padding: 36px 0 16px; }
    .brand { font-family: var(--serif); font-size: 30px; font-weight: 700; margin: 0; letter-spacing: -0.5px; }
    .brand a { color: inherit; text-decoration: none; }
    .flow { display: flex; gap: 6px; align-items: center; margin-top: 8px; font-size: 13px; color: var(--ink-soft); }
    .flow b { color: var(--accent); }
    .flow .later { opacity: .55; }
    .notice {
      background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: var(--radius);
      padding: 10px 14px; font-size: 14px; margin: 12px 0 24px;
    }

    /* 종이 한 장 */
    .sheet {
      background: var(--sheet); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 22px 22px; margin-bottom: 18px; box-shadow: 0 1px 0 rgba(0,0,0,.03);
    }
    h2 { font-family: var(--serif); font-size: 21px; margin: 0 0 14px; }
    h3 { font-family: var(--serif); font-size: 17px; margin: 0 0 10px; }
    .muted { color: var(--ink-soft); font-size: 13px; }

    /* 폼 */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
    .full { grid-column: 1 / -1; }
    label.f { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    label.f .req { color: var(--high); }
    .hint { font-weight: 400; color: var(--ink-soft); }
    input[type=text], input[type=date], input[type=number], textarea {
      width: 100%; background: #fff; border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px;
    }
    textarea { min-height: 70px; resize: vertical; }
    input:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
    .time { display: flex; gap: 8px; align-items: center; }
    .time input { width: 90px; }
    .prio { display: flex; gap: 8px; flex-wrap: wrap; }
    .prio label {
      border: 1px solid var(--rule); border-radius: 999px; padding: 4px 14px; cursor: pointer; font-size: 14px; background: #fff;
    }
    .prio input { position: absolute; opacity: 0; pointer-events: none; }
    .prio input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 3px; }
    .prio label:has(input:checked) { border-color: currentColor; font-weight: 600; }
    .prio .high { color: var(--high); } .prio .medium { color: var(--medium); } .prio .low { color: var(--low); }
    .actions { display: flex; gap: 8px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
    .btn {
      border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 8px;
      padding: 8px 16px; cursor: pointer; font-weight: 600;
    }
    .btn.ghost { background: transparent; color: var(--accent); }
    .btn:disabled { opacity: .5; cursor: default; }
    .err { color: var(--error); font-size: 14px; }

    /* 계획 목록 */
    .plan-list { list-style: none; padding: 0; margin: 0; }
    .plan-list li + li { border-top: 1px dashed var(--rule); }
    .plan-list a {
      display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 4px;
      color: inherit; text-decoration: none;
    }
    .plan-list a:hover .t { color: var(--accent); text-decoration: underline; }
    .plan-list .t { font-weight: 600; }
    .plan-list .m { grid-column: 1; font-size: 13px; color: var(--ink-soft); }
    .plan-list .b { grid-row: 1 / 3; grid-column: 2; display: flex; gap: 6px; align-items: center; }

    .badge { font-size: 12px; padding: 2px 9px; border-radius: 999px; white-space: nowrap; font-weight: 600; }
    .badge.high { background: var(--high-bg); color: var(--high); }
    .badge.medium { background: var(--medium-bg); color: var(--medium); }
    .badge.low { background: var(--low-bg); color: var(--low); }
    .badge.ver { background: var(--accent-soft); color: var(--accent); }

    /* 계획 상세 */
    .detail-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
    .detail-head h2 { margin: 0; }
    dl.facts { display: grid; grid-template-columns: 7em 1fr; gap: 8px 12px; margin: 16px 0 0; }
    dl.facts dt { color: var(--ink-soft); font-size: 13px; padding-top: 2px; }
    dl.facts dd { margin: 0; }
    .criteria { border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; background: var(--accent-soft); border-radius: 0 6px 6px 0; }
    .pre { white-space: pre-wrap; }

    /* 이력 타임라인 */
    .timeline { list-style: none; margin: 0; padding: 0 0 0 18px; border-left: 2px solid var(--rule); }
    .timeline > li { position: relative; padding: 0 0 18px 14px; }
    .timeline > li::before {
      content: ""; position: absolute; left: -25px; top: 6px; width: 12px; height: 12px;
      border-radius: 50%; background: var(--sheet); border: 2px solid var(--accent);
    }
    .timeline > li.now::before { background: var(--accent); }
    .timeline > li.origin::before { border-color: var(--ink); background: var(--ink); }
    .v-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
    .v-head strong { font-family: var(--serif); }
    .why { margin: 4px 0 6px; font-size: 14px; }
    .why::before { content: "고친 이유 · "; color: var(--ink-soft); }
    .diff { list-style: none; margin: 4px 0 0; padding: 0; font-size: 14px; }
    .diff li { padding: 2px 0; }
    .diff .k { color: var(--ink-soft); display: inline-block; min-width: 6em; }
    .diff del { color: var(--ink-soft); text-decoration-color: var(--error); }
    .diff ins { text-decoration: none; background: var(--accent-soft); padding: 0 4px; border-radius: 4px; }
    .snapshot { margin-top: 6px; background: #fbf8f1; border: 1px dashed var(--rule); border-radius: 8px; padding: 10px 12px; }
    .snapshot dl.facts { margin: 0; grid-template-columns: 6.5em 1fr; font-size: 14px; }

    .empty { color: var(--ink-soft); padding: 8px 0; }
    .status { padding: 30px 0; text-align: center; color: var(--ink-soft); }

    /* ---------- 할 일 (카드 2) ---------- */
    .sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    .sec-head h2 { margin-bottom: 10px; }
    select {
      background: #fff; border: 1px solid var(--rule); border-radius: 8px; padding: 7px 8px; max-width: 100%;
    }
    .task-add {
      display: grid; grid-template-columns: 1fr auto auto; gap: 8px 12px; align-items: end;
      background: #fbf8f1; border: 1px dashed var(--rule); border-radius: 8px; padding: 12px; margin-bottom: 16px;
    }
    .task-add .wide { grid-column: 1 / -1; }
    .task-add .row2 { grid-column: 1 / -1; display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: end; }
    .task-add label.f, .task-edit label.f { font-size: 12px; margin-bottom: 2px; }
    .mins { display: flex; gap: 4px; align-items: center; white-space: nowrap; }
    .mins input { width: 58px; }

    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .toolbar input[type=search] {
      flex: 1 1 180px; background: #fff; border: 1px solid var(--rule); border-radius: 8px; padding: 7px 10px;
    }
    .toolbar label { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--ink-soft); }
    .sort-rule {
      margin: 10px 0 4px; font-size: 13px; color: var(--ink-soft);
      border-top: 1px solid var(--line); padding-top: 8px;
    }
    .sort-rule b { color: var(--ink); font-weight: 600; }
    .linklike { background: none; border: 0; color: var(--accent); text-decoration: underline; cursor: pointer; padding: 0; font-size: 13px; }

    .task-list { list-style: none; margin: 0; padding: 0; }
    .task {
      display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start;
      padding: 12px 2px; border-bottom: 1px dashed var(--rule);
    }
    .task input[type=checkbox] { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); cursor: pointer; }
    .task .tt { font-weight: 600; word-break: break-word; }
    .task.done .tt { text-decoration: line-through; color: var(--ink-soft); font-weight: 400; }
    .task .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
    .task .row-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .small { font-size: 13px; padding: 4px 10px; border-radius: 6px; }
    .btn.danger { border-color: var(--error); color: var(--error); background: transparent; }
    .chip {
      border: 1px solid var(--rule); background: #fff; border-radius: 999px; padding: 0 8px;
      font-size: 12px; color: var(--ink); cursor: pointer;
    }
    .chip:hover, .chip.on { border-color: var(--accent); color: var(--accent); }
    .due-late { color: var(--error); font-weight: 600; }
    .due-today { color: var(--medium); font-weight: 600; }
    .task-edit { grid-column: 2 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .task-edit .wide { grid-column: 1 / -1; }

    /* ---------- 실행 기록 (카드 3) ---------- */
    .log-form { grid-column: 1 / -1; background: #fbf8f1; border: 1px dashed var(--rule); border-radius: 8px; padding: 12px; }
    .lf-title { margin: 0 0 8px; font-size: 14px; }
    .lf-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px 12px; align-items: start; }
    .lf-grid .wide { grid-column: 1 / -1; }
    .lf-grid label.f { font-size: 12px; margin-bottom: 2px; }
    .lf-grid textarea { min-height: 56px; }
    input[type=datetime-local] { width: 100%; background: #fff; border: 1px solid var(--rule); border-radius: 8px; padding: 7px 8px; }
    .check { display: flex; gap: 8px; align-items: center; font-size: 14px; cursor: pointer; }
    .check input { width: 18px; height: 18px; accent-color: var(--accent); }
    .span-hint { display: block; font-size: 12px; margin-top: 2px; }
    .task-logs { margin-top: 6px; font-size: 13px; }
    .task-logs summary { cursor: pointer; color: var(--accent); }
    .log-list { list-style: none; margin: 6px 0 0; padding: 0; }
    .log { border-left: 3px solid var(--accent-soft); padding: 4px 0 4px 10px; margin: 6px 0; font-size: 13px; }
    .log.blocked { border-left-color: var(--high-bg); }
    .log-top { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
    .log .when { font-variant-numeric: tabular-nums; color: var(--ink-soft); }
    .log .for { color: var(--accent); font-weight: 600; }
    .blocker { margin-top: 2px; }
    .blocker span { font-size: 11px; font-weight: 600; color: var(--high); background: var(--high-bg); border-radius: 4px; padding: 0 5px; margin-right: 4px; }
    h3.sub { font-size: 15px; margin: 18px 0 8px; }
    h3.sub:first-of-type { margin-top: 4px; }
    .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .stat { background: #fbf8f1; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
    .stat b { display: block; font-size: 18px; font-family: var(--serif); }
    .stat span { font-size: 12px; color: var(--ink-soft); }
    @media (max-width: 560px) {
      .lf-grid { grid-template-columns: 1fr; }
      .stats { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 560px) {
      .task-add { grid-template-columns: 1fr 1fr; }
      .task-add .row2 { grid-template-columns: 1fr; }
      .task { grid-template-columns: auto 1fr; }
      .task .row-actions { grid-column: 2; }
      .task-edit { grid-column: 1 / -1; grid-template-columns: 1fr; }
    }

    @media (max-width: 560px) {
      .grid { grid-template-columns: 1fr; }
      dl.facts { grid-template-columns: 1fr; gap: 2px; }
      dl.facts dd { margin-bottom: 8px; }
      .sheet { padding: 18px 16px; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="brand"><a href="#/">플랜두씨 다이어리</a></h1>
    <div class="flow"><b>Plan 계획</b> → <b>Do 실제로 한 일</b> → <span class="later">See 돌아보기</span></div>
  </header>

  <p class="notice" role="note">
    <strong>아직 로그인이 없습니다.</strong>
    이 주소를 아는 사람은 누구나 이 다이어리를 보고 고칠 수 있습니다. 남이 봐도 괜찮은 내용만 적어 주세요.
  </p>

  <main id="app"><p class="status">불러오는 중…</p></main>
</div>

<script>
/* ===================== 공통 도구 ===================== */
const app = document.getElementById('app');

// 사용자가 쓴 글을 화면에 넣을 때는 반드시 esc()를 거친다 (스크립트 삽입 방지)
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (ch) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

// key: "한 번의 의도"를 나타내는 요청 키(Idempotency-Key).
// 같은 키로 여러 번 보내도 서버는 한 번만 처리하고 처음 결과를 돌려준다.
async function api(path, options = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (options.key) headers['Idempotency-Key'] = options.key;
  const res = await fetch('/api' + path, {
    method: options.method || 'GET',
    headers,
    body: options.body ? JSON.stringify(options.body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch { /* 본문 없음 */ }
  // 409 = 같은 키의 요청을 서버가 지금 처리하는 중 → 이미 접수된 것이므로 오류가 아님
  if (res.status === 409 && options.key) return null;
  if (!res.ok) throw new Error(data?.error || `요청 실패 (${res.status})`);
  return data;
}

function newKey() {
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
  const h = [...b].map((x) => x.toString(16).padStart(2, '0')).join('');
  return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
}

const PRIORITY = { high: '높음', medium: '보통', low: '낮음' };
const FIELD_LABEL = {
  title: '계획 이름', start_date: '시작일', end_date: '종료일', priority: '우선순위',
  success_criteria: '성공 기준', estimated_minutes: '예상 시간', goal: '메모',
};

function fmtMinutes(m) {
  if (m == null) return '—';
  const h = Math.floor(m / 60), r = m % 60;
  return [h ? `${h}시간` : '', r ? `${r}분` : ''].filter(Boolean).join(' ') || '0분';
}
function fmtDate(d) {
  if (!d) return '—';
  const [y, m, day] = d.split('-').map(Number);
  const w = '일월화수목금토'[new Date(y, m - 1, day).getDay()];
  return `${m}월 ${day}일 (${w})`;
}
function days(a, b) {
  return Math.round((new Date(b) - new Date(a)) / 86400000) + 1;
}
function fmtStamp(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  if (isNaN(d)) return '';
  return d.toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function fmtField(k, v) {
  if (k === 'priority') return PRIORITY[v] ?? v;
  if (k === 'estimated_minutes') return fmtMinutes(v);
  if (k === 'start_date' || k === 'end_date') return fmtDate(v);
  return v ?? '(비어 있음)';
}
const isoToday = (offset = 0) => {
  const d = new Date(); d.setDate(d.getDate() + offset);
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
};

/* ===================== 계획 폼 (만들기·고치기 공용) ===================== */
function planForm(p = {}, { edit = false } = {}) {
  const est = p.estimated_minutes ?? '';
  const h = est === '' ? '' : Math.floor(est / 60);
  const m = est === '' ? '' : est % 60;
  const prio = p.priority || 'medium';
  return `
  <form id="plan-form" novalidate>
    <div class="grid">
      <div class="full">
        <label class="f" for="f-title">계획 이름 <span class="req">*</span></label>
        <input id="f-title" name="title" type="text" maxlength="100" required value="${esc(p.title)}"
               placeholder="예) ALEPH 과제 6 — 플랜두씨 다이어리 완성">
      </div>
      <div>
        <label class="f" for="f-start">시작일 <span class="req">*</span></label>
        <input id="f-start" name="start_date" type="date" required value="${esc(p.start_date || isoToday())}">
      </div>
      <div>
        <label class="f" for="f-end">종료일 <span class="req">*</span></label>
        <input id="f-end" name="end_date" type="date" required value="${esc(p.end_date || isoToday(6))}">
      </div>
      <div class="full">
        <span class="f" style="display:block;font-size:13px;font-weight:600;margin-bottom:4px">우선순위 <span class="req">*</span></span>
        <div class="prio" role="radiogroup" aria-label="우선순위">
          ${['high', 'medium', 'low'].map((k) => `
            <label class="${k}"><input type="radio" name="priority" value="${k}" ${prio === k ? 'checked' : ''}><span>${PRIORITY[k]}</span></label>`).join('')}
        </div>
      </div>
      <div class="full">
        <label class="f" for="f-criteria">성공 기준 <span class="req">*</span>
          <span class="hint">— 끝났을 때 무엇이 보이면 성공인가요?</span></label>
        <textarea id="f-criteria" name="success_criteria" maxlength="500" required
          placeholder="예) 배포 주소에서 카드 1~3 통과 기준을 모두 확인할 수 있다">${esc(p.success_criteria)}</textarea>
      </div>
      <div class="full">
        <label class="f" for="f-h">예상 시간 <span class="req">*</span>
          <span class="hint">— 이 계획 전체에 쓸 시간</span></label>
        <div class="time">
          <input id="f-h" name="hours" type="number" min="0" max="1666" step="1" value="${esc(h)}" aria-label="시간"> 시간
          <input id="f-m" name="minutes" type="number" min="0" max="59" step="5" value="${esc(m)}" aria-label="분"> 분
        </div>
      </div>
      <div class="full">
        <label class="f" for="f-goal">메모 <span class="hint">(선택)</span></label>
        <textarea id="f-goal" name="goal" maxlength="500" placeholder="왜 이 계획을 세웠는지, 참고할 것">${esc(p.goal)}</textarea>
      </div>
      ${edit ? `
      <div class="full">
        <label class="f" for="f-note">고친 이유 <span class="req">*</span>
          <span class="hint">— 이력에 함께 남습니다</span></label>
        <input id="f-note" name="change_note" type="text" maxlength="200" required
               placeholder="예) API 작업이 예상보다 오래 걸려서 시간을 늘림">
      </div>` : ''}
    </div>
    <div class="actions">
      <button class="btn" type="submit">${edit ? '고친 내용 저장' : '계획 저장'}</button>
      ${edit ? '<button class="btn ghost" type="button" id="cancel-edit">취소</button>' : ''}
      <span class="err" id="form-err" role="alert"></span>
    </div>
  </form>`;
}

// 폼 값 → API에 보낼 JSON. 화면에서 1차로 거르고, 최종 검사는 서버가 한다.
function readPlanForm(form) {
  const f = new FormData(form);
  const text = (k) => (f.get(k) || '').trim();
  const hours = Number(f.get('hours') || 0), minutes = Number(f.get('minutes') || 0);
  const data = {
    title: text('title'),
    start_date: f.get('start_date'),
    end_date: f.get('end_date'),
    priority: f.get('priority'),
    success_criteria: text('success_criteria'),
    estimated_minutes: Math.round(hours * 60 + minutes),
    goal: text('goal') || null,
  };
  if (!data.title) throw new Error('계획 이름을 적어 주세요');
  if (!data.start_date || !data.end_date) throw new Error('기간을 정해 주세요');
  if (data.end_date < data.start_date) throw new Error('종료일이 시작일보다 빠릅니다');
  if (!data.success_criteria) throw new Error('성공 기준을 적어 주세요');
  if (!(data.estimated_minutes >= 1)) throw new Error('예상 시간을 1분 이상 적어 주세요');
  if (f.has('change_note')) data.change_note = text('change_note');
  return data;
}

/* ===================== 화면 2: 계획 상세 + 고치기 + 이력 ===================== */
async function showPlan(id, params = new URLSearchParams()) {
  app.innerHTML = '<p class="status">불러오는 중…</p>';
  const [{ plan }, { versions }] = await Promise.all([api(`/plans/${id}`), api(`/plans/${id}/revisions`)]);

  app.innerHTML = `
    <p><a href="#/">← 계획 목록</a></p>
    <section class="sheet" id="plan-view">
      <div class="detail-head">
        <h2>${esc(plan.title)}</h2>
        <div style="display:flex;gap:6px;align-items:center">
          <span class="badge ver">v${plan.version}</span>
          <span class="badge ${esc(plan.priority)}">우선순위 ${PRIORITY[plan.priority] ?? ''}</span>
        </div>
      </div>
      <dl class="facts">
        <dt>계획 ID</dt><dd>#${plan.id} <span class="muted">— 고쳐도 바뀌지 않습니다</span></dd>
        <dt>기간</dt><dd>${fmtDate(plan.start_date)} ~ ${fmtDate(plan.end_date)} <span class="muted">(${days(plan.start_date, plan.end_date)}일)</span></dd>
        <dt>예상 시간</dt><dd>${fmtMinutes(plan.estimated_minutes)}</dd>
        <dt>성공 기준</dt><dd class="criteria pre">${esc(plan.success_criteria) || '<span class="muted">(없음)</span>'}</dd>
        ${plan.goal ? `<dt>메모</dt><dd class="pre">${esc(plan.goal)}</dd>` : ''}
      </dl>
      <div class="actions"><button class="btn ghost" id="start-edit">계획 고치기</button></div>
    </section>

    <section class="sheet" id="plan-edit" hidden>
      <h2>계획 고치기</h2>
      <p class="muted">저장하면 지금 내용은 아래 이력에 그대로 남고, 계획은 v${plan.version + 1}이 됩니다.</p>
      ${planForm(plan, { edit: true })}
    </section>

    ${tasksSection()}

    <section class="sheet" id="do">
      <div class="sec-head"><h2>실제로 한 일</h2>
        <span class="muted">계획과 따로 저장 — 기록해도 계획·예상 시간은 그대로</span></div>
      <h3 class="sub">돌아보기 집계</h3>
      <div class="stats" id="do-stats"></div>
      <p class="muted" style="margin:6px 0 0">완료는 할 일 하나당 한 번만 셉니다. 완료를 여러 번 눌러도, 되돌렸다 다시 완료해도 1건입니다.</p>
      <h3 class="sub">실행 기록 <span class="muted">— 최근 것부터, 어느 할 일의 기록인지 함께</span></h3>
      <ul class="log-list" id="do-logs"><li class="empty">불러오는 중…</li></ul>
    </section>

    <section class="sheet">
      <h2>변경 이력</h2>
      <p class="muted" style="margin-top:-8px">처음 세운 계획부터 지금까지. 예전 내용은 고칠 수 없습니다.</p>
      ${timeline(versions)}
    </section>`;

  const view = document.getElementById('plan-view'), edit = document.getElementById('plan-edit');
  document.getElementById('start-edit').onclick = () => {
    view.hidden = true; edit.hidden = false; document.getElementById('f-title').focus();
  };
  document.getElementById('cancel-edit').onclick = () => { edit.hidden = true; view.hidden = false; };

  const form = document.getElementById('plan-form');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    await submit(form, async () => {
      const data = readPlanForm(form);
      // 바뀐 칸만 보낸다
      const changes = Object.fromEntries(Object.entries(data)
        .filter(([k, v]) => k !== 'change_note' && (plan[k] ?? null) !== v));
      if (!Object.keys(changes).length) throw new Error('바뀐 내용이 없습니다');
      if (!data.change_note) throw new Error('고친 이유를 적어 주세요');
      await api(`/plans/${id}`, { method: 'PATCH', body: { ...changes, change_note: data.change_note } });
      await showPlan(id, currentTaskParams());
    });
  });

  initTasks(id, params);
}

function timeline(versions) {
  const items = versions.map((v, i) => {
    const prev = versions[i - 1];
    const isOrigin = i === 0, isNow = i === versions.length - 1;
    const label = isOrigin ? '처음 세운 계획' : `${i}번째 수정`;
    let body = '';
    if (isOrigin) {
      body = `<div class="snapshot"><dl class="facts">${
        ['title', 'start_date', 'end_date', 'priority', 'success_criteria', 'estimated_minutes', 'goal']
          .filter((k) => k !== 'goal' || v.goal)
          .map((k) => `<dt>${FIELD_LABEL[k]}</dt><dd class="pre">${esc(fmtField(k, v[k]))}</dd>`).join('')
      }</dl></div>`;
    } else {
      const changed = Object.keys(FIELD_LABEL).filter((k) => (prev[k] ?? null) !== (v[k] ?? null));
      body = `
        ${v.change_note ? `<p class="why">${esc(v.change_note)}</p>` : ''}
        <ul class="diff">${changed.map((k) => `
          <li><span class="k">${FIELD_LABEL[k]}</span>
            <del>${esc(fmtField(k, prev[k]))}</del> → <ins>${esc(fmtField(k, v[k]))}</ins></li>`).join('')}
        </ul>`;
    }
    return `<li class="${isOrigin ? 'origin' : ''} ${isNow ? 'now' : ''}">
      <div class="v-head"><strong>v${v.version} · ${label}</strong>
        ${isNow ? '<span class="badge ver">지금</span>' : ''}
        <span class="muted">${fmtStamp(v.valid_from)}</span></div>
      ${body}
    </li>`;
  });
  return `<ol class="timeline">${items.reverse().join('')}</ol>`;
}

/* ===================== 할 일 (카드 2) =====================
   검색·거르기·정렬은 전부 서버(/api/plans/{id}/tasks)가 한다.
   화면은 조건을 보내고, 받은 순서 그대로 그리기만 한다.            */
const TASK_DEFAULTS = { q: '', status: 'all', priority: 'all', tag: '', due: 'all', sort: 'due' };
const DUE_LABEL = { all: '전체', overdue: '지난 마감', today: '오늘 마감', week: '7일 안', none: '마감 없음' };
let tasksPlanId = null;
let taskReq = 0;          // 늦게 도착한 옛 응답을 버리기 위한 번호
let lastTasks = [];

function tasksSection() {
  return `
  <section class="sheet" id="tasks">
    <div class="sec-head"><h2>할 일</h2><span class="muted" id="task-count"></span></div>

    <form id="task-add" class="task-add" novalidate>
      <div class="wide">
        <label class="f" for="ta-title">할 일 <span class="req">*</span></label>
        <input id="ta-title" name="title" type="text" maxlength="100" placeholder="예) 할 일 API 붙이기">
      </div>
      <div>
        <label class="f" for="ta-due">마감일</label>
        <input id="ta-due" name="due_date" type="date">
      </div>
      <div>
        <label class="f" for="ta-prio">우선순위</label>
        <select id="ta-prio" name="priority">
          <option value="high">높음</option><option value="medium" selected>보통</option><option value="low">낮음</option>
        </select>
      </div>
      <div>
        <span class="f" style="display:block;font-size:12px;font-weight:600;margin-bottom:2px">예상 시간 <span class="req">*</span></span>
        <div class="mins">
          <input name="hours" type="number" min="0" max="24" value="1" aria-label="시간">시간
          <input name="minutes" type="number" min="0" max="59" step="5" value="0" aria-label="분">분
        </div>
      </div>
      <div class="row2">
        <div style="grid-column: 1 / 3">
          <label class="f" for="ta-tags">태그 <span class="hint">— 쉼표로 구분</span></label>
          <input id="ta-tags" name="tags" type="text" placeholder="예) 백엔드, API">
        </div>
        <button class="btn" type="submit">할 일 추가</button>
      </div>
      <span class="err wide" role="alert"></span>
    </form>

    <div class="toolbar" role="search">
      <input type="search" id="tq" placeholder="제목·태그 검색" aria-label="할 일 검색">
      <label>상태 <select id="tstatus">
        <option value="all">전체</option><option value="open">진행 중</option><option value="done">완료</option>
      </select></label>
      <label>우선순위 <select id="tpriority">
        <option value="all">전체</option><option value="high">높음</option><option value="medium">보통</option><option value="low">낮음</option>
      </select></label>
      <label>마감 <select id="tdue">
        ${Object.entries(DUE_LABEL).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}
      </select></label>
      <label>태그 <select id="ttag"><option value="">전체</option></select></label>
      <label>정렬 <select id="tsort"></select></label>
    </div>
    <p class="sort-rule" id="sort-rule"></p>
    <ul class="task-list" id="task-list"><li class="empty">불러오는 중…</li></ul>
  </section>`;
}

const $ = (id) => document.getElementById(id);

function currentTaskParams() {
  const p = new URLSearchParams();
  if (!$('tq')) return p;
  const now = { q: $('tq').value.trim(), status: $('tstatus').value, priority: $('tpriority').value,
                tag: $('ttag').value, due: $('tdue').value, sort: $('tsort').value || 'due' };
  for (const [k, v] of Object.entries(now)) if (v !== TASK_DEFAULTS[k]) p.set(k, v);
  return p;
}

function initTasks(planId, params) {
  tasksPlanId = planId;
  const get = (k) => params.get(k) ?? TASK_DEFAULTS[k];
  $('tq').value = get('q');
  $('tstatus').value = get('status');
  $('tpriority').value = get('priority');
  $('tdue').value = get('due');
  // 태그·정렬 목록은 서버 응답을 받은 뒤 채우므로 원하는 값을 먼저 기억해 둔다
  $('ttag').dataset.want = get('tag');
  $('tsort').dataset.want = get('sort');

  let timer;
  $('tq').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(loadTasks, 250); });
  for (const id of ['tstatus', 'tpriority', 'tdue', 'ttag', 'tsort']) $(id).addEventListener('change', loadTasks);

  const add = $('task-add');
  add.dataset.key = newKey();
  add.addEventListener('submit', async (e) => {
    e.preventDefault();
    await submit(add, async () => {
      await api(`/plans/${planId}/tasks`, { method: 'POST', key: add.dataset.key, body: readTaskForm(add) });
      add.dataset.key = newKey();                   // 다음 할 일은 새 키
      add.reset();
      add.querySelector('[name=hours]').value = 1;
      add.querySelector('[name=minutes]').value = 0;
      $('ta-title').focus();
      await loadTasks();
    });
  });

  $('task-list').addEventListener('click', onTaskClick);
  $('task-list').addEventListener('change', onTaskToggle);
  $('sort-rule').addEventListener('click', (e) => { if (e.target.id === 'reset-filters') resetFilters(); });
  loadTasks();
}

function readTaskForm(form) {
  const f = new FormData(form);
  const title = (f.get('title') || '').trim();
  const minutes = Number(f.get('hours') || 0) * 60 + Number(f.get('minutes') || 0);
  if (!title) throw new Error('할 일을 적어 주세요');
  if (!(minutes >= 1 && minutes <= 1440)) throw new Error('예상 시간은 1분~24시간 사이로 적어 주세요');
  return {
    title,
    due_date: f.get('due_date') || null,
    priority: f.get('priority'),
    planned_minutes: Math.round(minutes),
    tags: (f.get('tags') || '').split(',').map((t) => t.trim()).filter(Boolean),
  };
}

function resetFilters() {
  $('tq').value = ''; $('tstatus').value = 'all'; $('tpriority').value = 'all';
  $('tdue').value = 'all'; $('ttag').value = ''; $('ttag').dataset.want = '';
  loadTasks();
}

async function loadTasks() {
  const my = ++taskReq;
  const params = currentTaskParams();
  for (const id of ['ttag', 'tsort']) {          // 아직 목록이 안 채워졌으면 기억해 둔 값을 보낸다
    const want = $(id).dataset.want;
    const key = id === 'ttag' ? 'tag' : 'sort';
    if (want !== undefined && want !== TASK_DEFAULTS[key]) params.set(key, want);
  }
  // 주소창에도 조건을 남겨 둔다 → 새로고침·링크 공유해도 같은 화면
  const qs = params.toString();
  history.replaceState(null, '', `#/plan/${tasksPlanId}${qs ? '?' + qs : ''}`);

  let res;
  try {
    res = await api(`/plans/${tasksPlanId}/tasks?${qs}`);
  } catch (e) {
    if (my === taskReq) $('task-list').innerHTML = `<li class="err">${esc(e.message)}</li>`;
    return;
  }
  if (my !== taskReq) return;                      // 더 새 요청이 있으면 이 응답은 버림
  renderTasks(res);
}

function fillSelect(sel, options, value) {
  sel.innerHTML = options.map(([v, label]) =>
    `<option value="${esc(v)}" ${v === value ? 'selected' : ''}>${esc(label)}</option>`).join('');
  delete sel.dataset.want;
}

function dueText(t, today) {
  if (!t.due_date) return '<span>마감 없음</span>';
  const diff = Math.round((new Date(t.due_date) - new Date(today)) / 86400000);
  let tag = '';
  if (t.status !== 'done') {
    if (diff < 0) tag = ` <span class="due-late">${-diff}일 지남</span>`;
    else if (diff === 0) tag = ' <span class="due-today">오늘</span>';
    else tag = ` <span>D-${diff}</span>`;
  }
  return `<span>마감 ${fmtDate(t.due_date)}${tag}</span>`;
}

function renderTasks(res) {
  const q = res.query;
  lastTasks = res.tasks;
  renderStats(res);
  fillSelect($('ttag'), [['', '전체'], ...res.tags.map((t) => [t, '#' + t])], q.tag);
  fillSelect($('tsort'), Object.entries(res.sorts), res.sort.key);

  const filtered = q.q || q.status !== 'all' || q.priority !== 'all' || q.tag || q.due !== 'all';
  $('task-count').textContent = filtered ? `${res.total}개 중 ${res.shown}개 표시` : `모두 ${res.total}개`;
  $('sort-rule').innerHTML =
    `<b>정렬 기준</b> · ${res.sort.steps.map(esc).join(' → 같으면 ')}` +
    (filtered ? ` · <button type="button" class="linklike" id="reset-filters">조건 초기화</button>` : '');

  const list = $('task-list');
  if (!res.total) {
    list.innerHTML = '<li class="empty">아직 할 일이 없습니다. 위에서 이 계획의 할 일을 하나씩 넣어 보세요.</li>';
    return;
  }
  if (!res.shown) {
    list.innerHTML = '<li class="empty">조건에 맞는 할 일이 없습니다.</li>';
    return;
  }
  list.innerHTML = res.tasks.map((t) => `
    <li class="task ${t.status === 'done' ? 'done' : ''}" data-id="${t.id}" data-key="${newKey()}">
      <input type="checkbox" data-act="toggle" ${t.status === 'done' ? 'checked' : ''}
             aria-label="${esc(t.title)} ${t.status === 'done' ? '완료됨 — 누르면 진행 중으로' : '완료로 바꾸기'}">
      <div>
        <div class="tt">${esc(t.title)}</div>
        <div class="meta">
          ${dueText(t, res.today)}
          <span class="badge ${esc(t.priority)}">${PRIORITY[t.priority] ?? ''}</span>
          <span>예상 ${fmtMinutes(t.planned_minutes)}</span>
          ${t.tags.map((g) => `<button type="button" class="chip ${g === q.tag ? 'on' : ''}" data-act="tag" data-tag="${esc(g)}">#${esc(g)}</button>`).join('')}
        </div>
        ${taskLogs(t)}
      </div>
      <div class="row-actions">
        ${t.status === 'done'
          ? '<button type="button" class="btn ghost small" data-act="reopen">되돌리기</button>'
          : '<button type="button" class="btn small" data-act="complete">완료</button>'}
        <button type="button" class="btn ghost small" data-act="log">기록</button>
        <button type="button" class="btn ghost small" data-act="edit">고치기</button>
        <button type="button" class="btn danger small" data-act="delete">지우기</button>
      </div>
    </li>`).join('');
}

/* ----- 실행 기록 (카드 3) ----- */
function fmtClock(ts) {
  const d = new Date(ts);
  return isNaN(d) ? '' : d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false });
}
function fmtDay(ts) {
  const d = new Date(ts);
  return isNaN(d) ? '' : `${d.getMonth() + 1}/${d.getDate()}`;
}
function logLine(l, { withTask = false } = {}) {
  const when = l.started_at
    ? `${fmtDay(l.started_at)} ${fmtClock(l.started_at)}–${fmtClock(l.ended_at)}`
    : fmtDate(l.done_date);
  return `
    <li class="log ${l.blocker ? 'blocked' : ''}">
      <div class="log-top">
        <span class="when">${when}</span>
        <span>실제 <b>${fmtMinutes(l.actual_minutes)}</b></span>
        ${l.status === 'done' ? '<span class="badge ver">이 기록으로 완료</span>' : ''}
        ${withTask ? `<span class="for">→ ${l.task_title ? esc(l.task_title) : '<i>계획에 없던 일</i>'}</span>` : ''}
      </div>
      ${l.blocker ? `<div class="blocker"><span>막힌 곳</span> ${esc(l.blocker)}</div>` : ''}
      ${l.note ? `<div class="muted pre">${esc(l.note)}</div>` : ''}
    </li>`;
}
function taskLogs(t) {
  if (!t.logs.length) return '';
  const total = t.logs.reduce((s, l) => s + l.actual_minutes, 0);
  return `
    <details class="task-logs">
      <summary>실행 기록 ${t.logs.length}건 · 실제 ${fmtMinutes(total)}
        <span class="muted">(예상 ${fmtMinutes(t.planned_minutes)})</span></summary>
      <ul class="log-list">${t.logs.map((l) => logLine(l)).join('')}</ul>
    </details>`;
}

// datetime-local 입력값(내 컴퓨터 시각) ↔ 시간대가 붙은 ISO 문자열
function toLocalInput(d) {
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
}
function fromLocalInput(v) {
  if (!v) return null;
  const d = new Date(v);                      // 내 컴퓨터 시간대로 해석
  return isNaN(d) ? null : d.toISOString();   // 서버에는 UTC(Z)로 보냄 → 시간대 손실 없음
}

function openLogForm(li, t) {
  li.querySelector('.log-form')?.remove();
  const end = new Date(); end.setSeconds(0, 0);
  const start = new Date(end.getTime() - Math.min(t.planned_minutes, 240) * 60000);
  const wrap = document.createElement('div');
  wrap.className = 'log-form';
  wrap.innerHTML = `
    <form novalidate data-key="${newKey()}">
      <p class="lf-title">실행 기록 — <b>${esc(t.title)}</b> <span class="muted">(예상 ${fmtMinutes(t.planned_minutes)}, 계획 값은 바뀌지 않습니다)</span></p>
      <div class="lf-grid">
        <div><label class="f">시작 시각 <span class="req">*</span></label>
          <input name="started_at" type="datetime-local" required value="${toLocalInput(start)}"></div>
        <div><label class="f">끝난 시각 <span class="req">*</span></label>
          <input name="ended_at" type="datetime-local" required value="${toLocalInput(end)}"></div>
        <div><span class="f" style="display:block;font-size:12px;font-weight:600">실제로 걸린 시간 <span class="req">*</span></span>
          <div class="mins">
            <input name="hours" type="number" min="0" max="24" aria-label="시간">시간
            <input name="minutes" type="number" min="0" max="59" aria-label="분">분
          </div>
          <span class="muted span-hint"></span></div>
        <div class="wide"><label class="f">막혔던 이유 <span class="hint">— 없었으면 비워 두세요</span></label>
          <textarea name="blocker" maxlength="500" placeholder="예) Vercel 환경변수 URL 끝에 /rest/v1이 붙어 있어서 30분 헤맴"></textarea></div>
        <div class="wide"><label class="f">메모 <span class="hint">(선택)</span></label>
          <input name="note" type="text" maxlength="500"></div>
        <label class="wide check"><input type="checkbox" name="complete" ${t.status === 'done' ? 'disabled' : ''}>
          이 기록으로 할 일 완료 ${t.status === 'done' ? '<span class="muted">(이미 완료됨)</span>' : ''}</label>
      </div>
      <div class="actions" style="margin-top:8px">
        <button class="btn small" type="submit">기록 저장</button>
        <button class="btn ghost small" type="button" data-act="cancel-log">취소</button>
        <span class="err" role="alert"></span>
      </div>
    </form>`;
  li.appendChild(wrap);
  const form = wrap.querySelector('form');
  const [h, m] = [form.querySelector('[name=hours]'), form.querySelector('[name=minutes]')];
  let touched = false;                           // 사람이 직접 고친 뒤에는 자동으로 덮어쓰지 않음
  const sync = () => {
    const s = new Date(form.started_at.value), e = new Date(form.ended_at.value);
    const span = Math.round((e - s) / 60000);
    form.querySelector('.span-hint').textContent =
      isNaN(span) ? '' : span < 0 ? '끝난 시각이 시작보다 빠릅니다' : `시작~끝 ${fmtMinutes(span)} (쉰 시간이 있으면 줄이세요)`;
    if (!touched && span >= 0) { h.value = Math.floor(span / 60); m.value = span % 60; }
  };
  form.started_at.addEventListener('input', sync);
  form.ended_at.addEventListener('input', sync);
  h.addEventListener('input', () => { touched = true; });
  m.addEventListener('input', () => { touched = true; });
  sync();
  form.querySelector('[data-act=cancel-log]').onclick = (e) => { e.stopPropagation(); wrap.remove(); };
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    await submit(form, async () => {
      const started_at = fromLocalInput(form.started_at.value), ended_at = fromLocalInput(form.ended_at.value);
      if (!started_at || !ended_at) throw new Error('시작·끝난 시각을 모두 적어 주세요');
      if (ended_at < started_at) throw new Error('끝난 시각이 시작보다 빠릅니다');
      const actual = Number(h.value || 0) * 60 + Number(m.value || 0);
      // form.dataset.key: 이 폼을 연 순간 정해진 키 → 저장을 몇 번 눌러도 기록은 1건
      await api(`/tasks/${t.id}/logs`, {
        method: 'POST', key: form.dataset.key,
        body: { started_at, ended_at, actual_minutes: Math.round(actual),
                blocker: form.blocker.value.trim() || null, note: form.note.value.trim() || null,
                complete: form.complete.checked },
      });
      await loadTasks();
    });
  });
  form.started_at.focus();
}

function renderStats(res) {
  const s = res.summary;
  const box = $('do-stats');
  if (!box) return;
  box.innerHTML = `
    <div class="stat"><b>${s.completions}</b><span>완료</span></div>
    <div class="stat"><b>${s.logs}</b><span>실행 기록</span></div>
    <div class="stat"><b>${fmtMinutes(s.actual)}</b><span>실제 시간 합</span></div>
    <div class="stat"><b>${fmtMinutes(s.planned)}</b><span>예상 시간 합</span></div>
    <div class="stat"><b>${s.blocked}</b><span>막힘 기록</span></div>`;
  $('do-logs').innerHTML = res.logs.length
    ? res.logs.map((l) => logLine(l, { withTask: true })).join('')
    : '<li class="empty">아직 실행 기록이 없습니다. 할 일의 <b>기록</b> 버튼으로 실제로 한 일을 남겨 보세요.</li>';
}

function taskOf(el) {
  const li = el.closest('li.task');
  return li && { li, task: lastTasks.find((t) => t.id === Number(li.dataset.id)) };
}

// 상태(완료/되돌리기) 바꾸기 — 세 겹의 중복 방지 중 화면 쪽 두 겹:
//  ① 같은 줄에서 나온 요청은 같은 키(li.dataset.key)를 쓴다 → 서버가 한 번만 처리
//  ② 바꾼 직전 잠깐은 같은 할 일의 상태 클릭을 무시 → 연타가 '되돌리기'를 눌러버리는 일 방지
//  (③ DB의 유일 인덱스가 마지막으로 막는다)
const statusCooldown = new Map();
async function setStatus(li, task, status, el) {
  const now = Date.now();
  if ((statusCooldown.get(task.id) || 0) > now) return loadTasks();
  statusCooldown.set(task.id, now + 800);
  el.disabled = true;
  try {
    await api(`/tasks/${task.id}`, { method: 'PATCH', key: li.dataset.key, body: { status } });
  } catch (err) {
    alert(err.message);
  }
  await loadTasks();
}

async function onTaskToggle(e) {
  if (e.target.dataset.act !== 'toggle') return;
  const { li, task } = taskOf(e.target);
  await setStatus(li, task, e.target.checked ? 'done' : 'open', e.target);
}

async function onTaskClick(e) {
  const act = e.target.dataset.act;
  if (!act || act === 'toggle') return;
  if (act === 'tag') {                 // 태그를 누르면 그 태그로 거르기
    $('ttag').value = e.target.dataset.tag;
    return loadTasks();
  }
  const { li, task } = taskOf(e.target);
  if (act === 'complete' || act === 'reopen') {   // 체크박스와 같은 동작을 글자 버튼으로
    return setStatus(li, task, act === 'complete' ? 'done' : 'open', e.target);
  }
  if (act === 'log') return openLogForm(li, task);
  if (act === 'delete') {
    if (!confirm(`"${task.title}" 할 일을 지울까요?\n딸린 실행 기록도 함께 지워집니다.`)) return;
    try { await api(`/tasks/${task.id}`, { method: 'DELETE' }); }
    catch (err) { alert(err.message); }
    return loadTasks();
  }
  if (act === 'edit') openTaskEdit(li, task);
}

function openTaskEdit(li, t) {
  li.innerHTML = `
    <form class="task-edit" novalidate>
      <div class="wide">
        <label class="f">할 일</label>
        <input name="title" type="text" maxlength="100" value="${esc(t.title)}">
      </div>
      <div><label class="f">마감일</label><input name="due_date" type="date" value="${esc(t.due_date || '')}"></div>
      <div><label class="f">우선순위</label>
        <select name="priority">${['high', 'medium', 'low'].map((k) =>
          `<option value="${k}" ${t.priority === k ? 'selected' : ''}>${PRIORITY[k]}</option>`).join('')}</select></div>
      <div><span class="f" style="display:block;font-size:12px;font-weight:600">예상 시간</span>
        <div class="mins">
          <input name="hours" type="number" min="0" max="24" value="${Math.floor(t.planned_minutes / 60)}" aria-label="시간">시간
          <input name="minutes" type="number" min="0" max="59" step="5" value="${t.planned_minutes % 60}" aria-label="분">분
        </div></div>
      <div><label class="f">태그 (쉼표로 구분)</label><input name="tags" type="text" value="${esc(t.tags.join(', '))}"></div>
      <div class="actions wide" style="margin-top:4px">
        <button class="btn small" type="submit">저장</button>
        <button class="btn ghost small" type="button" data-act="cancel">취소</button>
        <span class="err" role="alert"></span>
      </div>
    </form>`;
  const form = li.querySelector('form');
  li.querySelector('[data-act=cancel]').onclick = (e) => { e.stopPropagation(); loadTasks(); };
  form.querySelector('[name=title]').focus();
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    await submit(form, async () => {
      const data = readTaskForm(form);
      // 바뀐 칸만 보낸다
      const changes = Object.fromEntries(Object.entries(data).filter(([k, v]) =>
        JSON.stringify(v) !== JSON.stringify(t[k] ?? null)));
      if (Object.keys(changes).length) await api(`/tasks/${t.id}`, { method: 'PATCH', body: changes });
      await loadTasks();
    });
  });
}

/* ===================== 제출 공통 처리 ===================== */
async function submit(form, work) {
  const btn = form.querySelector('button[type=submit]');
  const err = form.querySelector('.err');
  err.textContent = '';
  btn.disabled = true;
  try { await work(); }
  catch (e) { err.textContent = e.message; }
  finally { btn.disabled = false; }
}

/* ===================== 주소(#) 따라 화면 고르기 ===================== */
async function route() {
  const m = location.hash.match(/^#\/plan\/(\d+)(?:\?(.*))?$/);
  try {
    if (m) await showPlan(Number(m[1]), new URLSearchParams(m[2] || ''));
    else await showHome();
  } catch (e) {
    app.innerHTML = `<section class="sheet"><h2>불러오지 못했습니다</h2>
      <p class="err">${esc(e.message)}</p>
      <p class="muted">서버나 데이터베이스에 연결하지 못했을 수 있습니다. 잠시 뒤 새로고침해 보세요.</p>
      <p><a href="#/">← 계획 목록</a></p></section>`;
  }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
</script>
